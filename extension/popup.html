<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NutriCheck Settings</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #0f172a;
        background: #f4f7f5;
      }
      .card {
        background: #ffffff;
        border: 1px solid #dfe7e3;
        border-radius: 10px;
        padding: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
        color: #0f172a;
      }
      p {
        font-size: 12.5px;
        color: #475569;
        margin: 0 0 10px;
        line-height: 1.45;
      }
      .stores {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 12px;
      }
      .store-tag {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        background: #eaf1ee;
        border: 1px solid #d5e2dc;
        color: #146c43;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 10px;
        background: #ffffff;
        color: #0f172a;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0f172a;
      }
      button.primary {
        background: #146c43;
        border-color: #105635;
        color: #ffffff;
      }
      button.primary:hover {
        background: #105635;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #166534;
        font-weight: 600;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>NutriCheck Store Watcher</h1>
      <p>
        Scans packet ingredients and food items directly on product pages and
        when you add items to cart.
      </p>
      <div class="stores">
        <span class="store-tag">Amazon</span>
        <span class="store-tag">Flipkart</span>
        <span class="store-tag">Swiggy Instamart</span>
        <span class="store-tag">Zomato</span>
        <span class="store-tag">Blinkit</span>
      </div>
      <label for="hg-url">NutriCheck Website URL</label>
      <input
        id="hg-url"
        type="url"
        placeholder="http://localhost:3000"
      />
      <div class="row">
        <button id="save-btn" class="primary" type="button">Save URL</button>
        <button id="open-btn" type="button">Open Dashboard</button>
      </div>
      <div id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
